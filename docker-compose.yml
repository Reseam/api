services:
  api:
    build: .
    environment:
      PATCHES_URL: https://cdn.reseam.app/patches/patches.json
      MANAGER_URL: https://cdn.reseam.app/manager/manager.json
      PATCHES_BUNDLE_BASE_URL: https://cdn.reseam.app/patches
      MANAGER_BINARY_BASE_URL: https://cdn.reseam.app/manager
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      DB_PATH: /data/reseam.db
      CACHE_TTL: "300"
    volumes:
      - reseam-data:/data
    ports:
      - "4000:4000"

volumes:
  reseam-data:
