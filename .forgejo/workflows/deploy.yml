name: deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: docker
    container:
      image: code.forgejo.org/oci/node:20-bookworm
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - /root/reseam-api:/deploy
    steps:
      - uses: actions/checkout@v4

      - name: install docker cli
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $codename stable" > /etc/apt/sources.list.d/docker.list
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends docker-ce-cli docker-compose-plugin

      - name: login to registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login git.reseam.app -u Cossale --password-stdin

      - name: build and push
        run: |
          docker build \
            -t git.reseam.app/reseam/api:latest \
            -t git.reseam.app/reseam/api:${{ github.sha }} \
            .
          docker push git.reseam.app/reseam/api:latest
          docker push git.reseam.app/reseam/api:${{ github.sha }}

      - name: deploy
        run: |
          cd /deploy
          docker compose pull
          docker compose up -d
