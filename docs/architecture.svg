<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'InterVariable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
	<style>
		.card { fill: #121212; stroke: #262626; stroke-width: 1.5; }
		.card-accent { fill: #121212; stroke: oklch(0.8808 0.0969 156.04); stroke-width: 1.5; }
		.inner { fill: #171717; stroke: none; }
		.chip { fill: #0a0a0a; stroke: #262626; stroke-width: 1; }
		.bar { fill: #262626; }
		.title { fill: #ededed; font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
		.label { fill: #a3a3a3; font-size: 11px; }
		.caption { fill: #a3a3a3; font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; }
		.mono { fill: #a3a3a3; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
		.accent-fill { fill: oklch(0.8808 0.0969 156.04); }
		.accent-stroke { stroke: oklch(0.8808 0.0969 156.04); stroke-width: 1.5; fill: none; }
		.link { stroke: #3f3f46; stroke-width: 1.5; fill: none; }
		.link-dashed { stroke: #3f3f46; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; }
		.arrowhead { fill: #3f3f46; }
		.arrowhead-accent { fill: oklch(0.8808 0.0969 156.04); }
	</style>
	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
			<path d="M0,0 L10,5 L0,10 z" class="arrowhead" />
		</marker>
		<marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
			<path d="M0,0 L10,5 L0,10 z" class="arrowhead-accent" />
		</marker>
	</defs>

	<g transform="translate(40,50)">
		<rect class="card" x="0" y="0" width="190" height="160" rx="20" />
		<rect class="inner" x="24" y="24" width="142" height="80" rx="10" />
		<text class="mono" x="38" y="48">{</text>
		<text class="mono" x="48" y="64">"bundle": …</text>
		<text class="mono" x="48" y="80">"releases": [ … ]</text>
		<text class="mono" x="38" y="96">}</text>
		<text class="title" x="95" y="132" text-anchor="middle">patches.json</text>
		<text class="caption" x="95" y="148" text-anchor="middle">reseam/patches</text>
	</g>

	<g transform="translate(360,40)">
		<rect class="card-accent" x="0" y="0" width="200" height="180" rx="22" />
		<text class="caption" x="100" y="26" text-anchor="middle">Reseam API</text>
		<rect class="chip" x="24" y="44" width="152" height="56" rx="10" />
		<circle class="accent-fill" cx="42" cy="68" r="5" />
		<text class="title" x="58" y="64" font-size="12">Cache</text>
		<text class="label" x="58" y="80">patches.json</text>
		<text class="label" x="58" y="93">manager.json</text>
		<rect class="chip" x="24" y="114" width="152" height="48" rx="10" />
		<circle class="accent-fill" cx="42" cy="138" r="5" />
		<text class="title" x="58" y="134" font-size="12">SQLite</text>
		<text class="label" x="58" y="150">announcements</text>
	</g>

	<g transform="translate(820,20)">
		<rect class="card" x="0" y="0" width="72" height="120" rx="16" />
		<rect class="inner" x="8" y="18" width="56" height="88" rx="8" />
		<rect class="bar" x="16" y="30" width="30" height="4" rx="2" />
		<rect class="bar" x="16" y="42" width="40" height="4" rx="2" />
		<rect class="bar" x="16" y="54" width="24" height="4" rx="2" />
		<rect class="accent-fill" x="16" y="86" width="40" height="12" rx="4" opacity="0.3" />
		<text class="caption" x="36" y="140" text-anchor="middle" font-size="9">Manager</text>
	</g>

	<g transform="translate(810,190)">
		<rect class="card" x="0" y="0" width="92" height="100" rx="12" />
		<rect class="inner" x="8" y="14" width="76" height="74" rx="6" />
		<circle cx="16" cy="8" r="2.5" class="bar" />
		<circle cx="24" cy="8" r="2.5" class="bar" />
		<circle cx="32" cy="8" r="2.5" class="bar" />
		<rect class="bar" x="16" y="30" width="30" height="4" rx="2" />
		<rect class="bar" x="16" y="42" width="50" height="4" rx="2" />
		<rect class="bar" x="16" y="54" width="40" height="4" rx="2" />
		<rect class="bar" x="16" y="68" width="60" height="14" rx="4" />
		<text class="caption" x="46" y="118" text-anchor="middle" font-size="9">Website</text>
	</g>

	<line class="accent-stroke" x1="234" y1="130" x2="356" y2="130" marker-end="url(#arrow-accent)" />
	<text class="label" x="295" y="122" text-anchor="middle">fetch + cache</text>

	<line class="link" x1="564" y1="100" x2="816" y2="80" marker-end="url(#arrow)" />
	<text class="label" x="680" y="72" text-anchor="middle">/v1/patches</text>

	<line class="link" x1="564" y1="190" x2="806" y2="240" marker-end="url(#arrow)" />
	<text class="label" x="670" y="228" text-anchor="middle">/patches/:tag/:file</text>

	<g transform="translate(40,290)">
		<rect class="card" x="0" y="0" width="190" height="70" rx="14" />
		<text class="title" x="95" y="30" text-anchor="middle">Third-party bundle</text>
		<text class="label" x="95" y="50" text-anchor="middle">any patches.json URL</text>
	</g>
	<path class="link-dashed" d="M 220 320 C 400 320, 660 260, 820 150" marker-end="url(#arrow)" />
	<text class="label" x="500" y="310" text-anchor="middle">Reseam Manager reads directly, bypasses the API</text>
</svg>
